# k6 load generator — drives continuous user traffic against the frontend so the
# casino emits a steady stream of telemetry (and the planted defects stay visible
# downstream) for the whole training session, with no manual clicking.
#
# Image: upstream grafana/k6 (multi-arch amd64+arm64), pinned. There is NO custom
# vegasapp-k6 image — the load script lives in the ConfigMap below and is mounted
# into the stock k6 image at /scripts (ISI-7625 D2b). This removes the only
# casino image that was never built/published by CI.
#
# Modelled as a Deployment so Argo CD reports Healthy while load runs. k6 runs
# one test for DURATION (sized for a ~3h session), exits, and is restarted,
# giving continuous load.
# VUS is kept low (3) to stay within the per-attendee cluster budget.
#
# The init container waits for the frontend /health before starting load, but is
# non-fatal (exits 0 on timeout) so k6 still attempts the run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vegas-casino-loadgen-script
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: loadgen
data:
  casino-load.js: |
    // Casino load script for the OTel-training frontend. Each VU logs in a
    // random player, browses the lobby, then plays the four games via the
    // frontend HTTP API (frontend fans these out over gRPC to the game services,
    // so every game pod sees traffic and emits spans/metrics/logs).
    //
    // Env (set by the Job): CASINO_URL, VUS, DURATION, RAMP_UP.
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    const BASE = __ENV.CASINO_URL || 'http://vegas-casino-frontend:3000';
    const VUS = Number(__ENV.VUS || 3);

    // GAMES selects which games this loadgen drives (ISI-7653 casino lite
    // profile). Default = the full four-game topology. The lite profile narrows
    // it to the surviving services (e.g. "slots,blackjack") so the loadgen never
    // calls the dropped roulette/dice routes. A game not in the set is skipped.
    const GAMES = new Set(
      (__ENV.GAMES || 'slots,roulette,dice,blackjack')
        .split(',').map((g) => g.trim()).filter(Boolean),
    );

    export const options = {
      scenarios: {
        casino: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: __ENV.RAMP_UP || '30s', target: VUS },
            { duration: __ENV.DURATION || '3h', target: VUS },
            { duration: '10s', target: 0 },
          ],
          gracefulStop: '15s',
        },
      },
      // Keep going when the planted defects make some calls fail — a non-2xx is
      // expected signal here, not a reason to abort the run.
      thresholds: {},
    };

    const JSON_HDR = { headers: { 'Content-Type': 'application/json' } };

    // check() that also logs failures (and only failures) so `kubectl logs` shows
    // what is breaking while k6 only prints its summary at the end of the test.
    function checked(res, name) {
      const pass = check(res, { [name]: (r) => r.status >= 200 && r.status < 300 });
      if (!pass) console.error(`FAIL ${name}: ${res.request.method} ${res.request.url} -> ${res.status}`);
      return pass;
    }

    function player() {
      return `loadgen-${__VU}-${Math.floor(Math.random() * 1000)}`;
    }

    export default function () {
      const username = player();

      // 1. Land on the lobby and list the games.
      checked(http.get(`${BASE}/`), 'lobby');
      checked(http.get(`${BASE}/api/games`), 'games listed');

      // 2. Log in + seed a balance.
      // Login validates email + a profileType in ['partner','customer','dynatracer','other'],
      // so send a well-formed payload (otherwise it 400s and user.login shows a
      // 100% error rate in the lab).
      const creds = JSON.stringify({
        Username: username,
        Email: `${username}@loadgen.test`,
        ProfileType: 'other',
        Balance: 1000,
      });
      checked(http.post(`${BASE}/api/user/login`, creds, JSON_HDR), 'login');
      http.post(`${BASE}/api/user/init`, JSON.stringify({ Username: username, Balance: 1000 }), JSON_HDR);
      http.get(`${BASE}/api/user/balance?username=${username}`);

      // 3. Play each selected game. The frontend routes these to the slots /
      //    roulette / dice / blackjack services over gRPC. GAMES (see top) gates
      //    each call so the lite profile skips the dropped roulette/dice routes.
      const bet = JSON.stringify({ Username: username, BetAmount: 10 });
      if (GAMES.has('slots')) http.post(`${BASE}/api/games/slots/spin`, bet, JSON_HDR);
      if (GAMES.has('roulette')) http.post(`${BASE}/api/games/roulette/spin`,
        JSON.stringify({ Username: username, BetAmount: 10, BetType: 'red' }), JSON_HDR);
      if (GAMES.has('dice')) http.post(`${BASE}/api/dice/roll`,
        JSON.stringify({ Username: username, BetAmount: 10, BetType: 'pass' }), JSON_HDR);
      if (GAMES.has('blackjack')) http.post(`${BASE}/api/games/blackjack/deal`, bet, JSON_HDR);

      // 4. Read-side traffic (dashboard + leaderboard aggregate the games).
      http.get(`${BASE}/api/leaderboard`);
      http.get(`${BASE}/api/dashboard`);

      sleep(1 + Math.random() * 2);
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vegas-casino-loadgen
  labels:
    app.kubernetes.io/name: vegas-casino
    app.kubernetes.io/instance: vegas-casino
    app.kubernetes.io/part-of: casino
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: vegas-casino
      app.kubernetes.io/component: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vegas-casino
        app.kubernetes.io/instance: vegas-casino
        app.kubernetes.io/component: loadgen
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-for-frontend
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for frontend service to be ready..."
              FRONTEND_URL="http://vegas-casino-frontend:3000"
              for i in $(seq 1 60); do
                if curl -f -s --max-time 5 "$FRONTEND_URL/health" > /dev/null 2>&1; then
                  echo "Frontend service is ready."
                  exit 0
                fi
                if [ $((i % 6)) -eq 0 ]; then
                  echo "Attempt $i/60: frontend not ready yet, waiting..."
                fi
                sleep 5
              done
              echo "Frontend did not become ready in 5 minutes (non-fatal); k6 will try anyway."
              exit 0
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          imagePullPolicy: IfNotPresent
          command:
            - k6
            - run
            - /scripts/casino-load.js
          env:
            - name: CASINO_URL
              value: "http://vegas-casino-frontend:3000"
            - name: VUS
              value: "3"
            - name: DURATION
              value: "3h"
            - name: RAMP_UP
              value: "30s"
            # Games the loadgen drives. Full profile = all four; the lite profile
            # (ISI-7653) rewrites this to "slots,blackjack" at seed/apply time via
            # deploy/casino/lite-filter.sh so no traffic hits the dropped services.
            - name: GAMES
              value: "slots,roulette,dice,blackjack"
          volumeMounts:
            - name: loadgen-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
      volumes:
        - name: loadgen-script
          configMap:
            name: vegas-casino-loadgen-script
