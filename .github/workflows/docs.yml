name: docs

# Build the MkDocs attendee guide, verify mermaid renders in both the default
# (light) and slate (dark) palettes, and deploy to GitHub Pages from main.
# ISI-6929 (ISI-6913 §3/§6).

on:
  push:
    branches: ["main"]
    paths:
      - "mkdocs.yml"
      - "docs-site/**"
      - "requirements-docs.txt"
      - "scripts/check_docs_mermaid.py"
      - "scripts/render_palettes.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs-site/**"
      - "requirements-docs.txt"
      - "scripts/check_docs_mermaid.py"
      - "scripts/render_palettes.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow one Pages deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Static mermaid/nav checks
        run: python scripts/check_docs_mermaid.py site

      - name: Install Playwright Chromium
        # `playwright install --with-deps` apt-installs OS libraries and downloads
        # the Chromium build; on a freshly-rotated `ubuntu-latest` runner image this
        # step intermittently fails (transient apt-mirror / browser-download errors),
        # which skips the render gate and reds the whole PR even when the docs are
        # fine. Split the apt deps from the browser download and retry each up to 3×
        # so a transient hiccup no longer blocks the build. Still fails hard if the
        # install genuinely cannot complete.
        run: |
          set -eu
          pip install playwright
          retry() {
            n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "::error::'$*' failed after $n attempts"; return 1; fi
              echo "attempt $n for '$*' failed; retrying in 10s"; sleep 10
            done
          }
          retry python -m playwright install-deps chromium
          retry python -m playwright install chromium

      - name: Render check — mermaid in both palettes
        run: python scripts/render_palettes.py site

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    # Publish to GitHub Pages only from main, after the build+render gate passes.
    #
    # ISI-7607: this repo's Pages is configured with build_type=workflow, so the
    # live site is served ONLY from an artifact uploaded by actions/deploy-pages.
    # The previous step ran `mkdocs gh-deploy --force`, which pushes the gh-pages
    # branch — the legacy "deploy from branch" method that build_type=workflow
    # IGNORES. Result: every run updated the gh-pages branch but the live site
    # never changed (it was frozen at the last real workflow deploy). Switching
    # to the official upload-pages-artifact + deploy-pages flow makes the deploy
    # actually reach the CDN, matching the repo's Pages build_type.
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the Pages artifact to be visible to the API
        # ISI-7829: upload-pages-artifact finalizes the `github-pages` artifact,
        # but actions/deploy-pages@v4 can query the run's artifacts a few hundred
        # ms later and still miss it (API eventual consistency), failing with
        # "No artifacts named 'github-pages' were found" even though the upload
        # succeeded (seen on runs 45382739448 and 45601037337). Poll the same
        # two endpoints deploy-pages uses (list by name, then get by id) until
        # the artifact is fully visible before handing off to deploy-pages.
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages';
            for (let attempt = 1; attempt <= 12; attempt++) {
              const list = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                name,
                per_page: 10,
              });
              const artifact = list.data.artifacts.find((a) => a.name === name && !a.expired);
              if (artifact) {
                try {
                  // Raw route via github.request: the generated
                  // `rest.actions.getWorkflowRunArtifact` method name differs across
                  // octokit versions bundled with github-script (v7's octokit does
                  // not have it). Use the GLOBAL artifact endpoint — the run-scoped
                  // one (/actions/runs/{run_id}/artifacts/{artifact_id}) 404s for
                  // artifacts uploaded via upload-artifact@v4 (verified against run
                  // 45649746690 with a PAT: run-scoped = 404, global = 200).
                  await github.request('GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  core.info(`artifact ${name} (id ${artifact.id}) fully visible after ${attempt} attempt(s)`);
                  // deploy-pages@v4 lists artifacts through the internal Twirp
                  // results service, which lags the REST API by a few hundred ms
                  // (run 45651744810: REST-visible on attempt 1, deploy-pages still
                  // got an empty list 0.4s later). Give that service time to catch
                  // up before handing off.
                  await new Promise((resolve) => setTimeout(resolve, 15000));
                  core.info('settled 15s for the results service to catch up');
                  return;
                } catch (e) {
                  core.info(`attempt ${attempt}: listed but detail fetch failed: ${e.message}`);
                }
              } else {
                core.info(`attempt ${attempt}: ${name} not yet visible`);
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`artifact ${name} still not visible after 60s`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Re-run failed deploy jobs once
        # ISI-7829: if deploy-pages still hit the artifact-service race, re-run the
        # failed jobs a single time (github.run_attempt guard prevents a loop).
        # Historically attempt 2 succeeds (run 45601037337).
        if: failure() && github.run_attempt < 2
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            core.info('requested re-run of failed jobs (attempt 2)');
