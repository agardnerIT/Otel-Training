name: Build casino images

# Builds the 8 vendored casino service images from apps/casino/ and publishes
# them to the repo's own GHCR namespace so the codespace (and every fork) can
# pull them without a personal token (ISI-7577 / ISI-7587 Track 2).
#
# Image name (nested under the repo, per approved plan ISI-7577 §4.1):
#   ghcr.io/<owner>/otel-training/vegasapp-<svc>
#
# - Pull requests: build only (validates amd64 + arm64 build, no push — forks
#   have no registry credentials on PR events).
# - Pushes to main / the training lineage + manual dispatch: build AND push.
# - Baseline (upstream repo): GITHUB_TOKEN has packages:write; the one-time
#   "make public" action (see the `visibility` step summary) makes the baseline
#   images anonymously pullable so a fresh fork launches with no token.
# - Fork-friendly: the SAME workflow runs on an attendee fork (after they enable
#   Actions once) and publishes to THEIR namespace. Fork images may stay private
#   and are pulled via an imagePullSecret wired by c3 (ISI-7589).
on:
  push:
    branches:
      - main
      - "training/**"
    paths:
      - "apps/casino/**"
      - ".github/workflows/casino-images.yml"
  pull_request:
    paths:
      - "apps/casino/**"
      - ".github/workflows/casino-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - slots
          - blackjack
          - dashboard
          - roulette
          - dice
          - scoring
          # NOTE: `gateway` is intentionally NOT built — nothing in the training
          # topology deploys it (deploy/casino/README.md "Design decisions"
          # explicitly excludes the API-gateway service). Building an image no
          # manifest references just burned CI minutes (ISI-7625 D3). If the
          # gateway ever enters the deployed topology, re-add it here AND add a
          # manifest — don't re-add it on its own.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR package names must be lowercase. The owner login is normalised so a
      # fork with a mixed-case owner still produces a valid name. The images are
      # nested under `otel-training/` so every casino package groups under the
      # repo in the owner's GHCR (ISI-7577 §4.1).
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/otel-training/vegasapp-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # Single source of truth for the immutable version tag (ISI-7625 D1):
      # deploy/casino/IMAGE_VERSION. The casino manifests default IMAGE_TAG to
      # this same file (render-images.sh), so the tag the manifests pin is the
      # tag CI publishes. To cut a new image set: bump deploy/casino/IMAGE_VERSION
      # in a PR — the push republishes every service at the new immutable tag.
      - name: Read casino image version
        id: ver
        run: echo "value=$(tr -d '[:space:]' < deploy/casino/IMAGE_VERSION)" >> "$GITHUB_OUTPUT"

      # QEMU is only needed to emulate arm64 RUN steps (npm/pip/mvn) on the
      # amd64 runner. The Go `dice` service cross-compiles natively via
      # --platform=$BUILDPLATFORM, so it does not rely on emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          labels: |
            org.opencontainers.image.title=vegasapp-${{ matrix.service }}
            org.opencontainers.image.description=OTel training casino — ${{ matrix.service }} service
          tags: |
            type=raw,value=${{ steps.ver.outputs.value }}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/casino
          file: apps/casino/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Build only on PRs (no registry credentials from forks); push on
          # branch pushes and manual dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vegasapp-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=vegasapp-${{ matrix.service }}
          # Skip the extra provenance/attestation manifest so the pushed tag is
          # a plain multi-arch image index that kind/containerd pull cleanly.
          provenance: false

      # GHCR packages are PRIVATE on first publish, and there is NO REST API to
      # flip a user-namespace container package to public — it is a one-time UI
      # action that then PERSISTS across every future push. The baseline images
      # must be public so a fresh fork pulls them anonymously (plan §6). Surface
      # the exact one-time step in the run summary instead of silently leaving
      # the package private (which reproduces the original 403).
      - name: GHCR package visibility (baseline = public)
        if: github.event_name != 'pull_request'
        run: |
          PKG="otel-training/vegasapp-${{ matrix.service }}"
          {
            echo "### Published \`${{ steps.img.outputs.name }}\`"
            echo ""
            echo "Multi-arch (linux/amd64, linux/arm64) image pushed to GHCR."
            echo ""
            echo "**One-time baseline step (upstream repo only):** make this package **public** so"
            echo "attendee forks pull it anonymously on first launch (no token):"
            echo ""
            echo "1. Open **https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PKG}/settings** (orgs: \`/orgs/<org>/packages/...\`)"
            echo "2. **Danger Zone → Change visibility → Public**"
            echo ""
            echo "This persists — later pushes to the same package stay public. Fork builds may"
            echo "stay private; they are pulled via the \`ghcr-pull\` imagePullSecret (ISI-7589 c3)."
          } >> "$GITHUB_STEP_SUMMARY"
