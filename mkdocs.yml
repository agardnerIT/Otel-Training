site_name: Beyond the Honeymoon — OTel in Practice
site_description: One integrated hands-on OpenTelemetry training on the Vegas Casino — a single module arc from environment setup to fleet management, every fix verified in Dynatrace (Dynatrace Perform workshop)
site_author: Henrik Rexed / IsItObservable

docs_dir: docs-site
site_dir: site

theme:
  name: material
  # ISI-7632 (#59): clickable-to-enlarge Mermaid diagrams are wired in through a
  # custom_dir template override (overrides/main.html injects the zoom <link>/
  # <script>), NOT via extra_javascript. mkdocs-mermaid2 1.2.x treats any
  # extra_javascript entry whose basename contains "mermaid" as the library
  # override and then skips the real runtime (diagrams silently fail), so the
  # override path is the only mermaid2-safe way to add the lightbox.
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # mkdocs-mermaid2-plugin clashes with Material's native superfences mermaid
  # handling (ISI-6913 §4.2). The fix is to register a custom fence that hands
  # ```mermaid blocks to mermaid2.fence_mermaid instead of letting superfences
  # syntax-highlight them. With this in place the two coexist: superfences emits
  # <pre class="mermaid"> and the mermaid2 plugin renders it client-side.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  # One single training guide (ISI-7758 / ISI-7764): one flat module arc
  # M0–M10, no separate "advanced" track. The former advanced step pages
  # keep their files under docs-site/advanced/ but are ordinary modules here.
  - Welcome: index.md
  - M0 — Environment setup: setup.md
  - M1 — Tour the broken casino: module-1.md
  - M2 — Instrument the casino: module-2.md
  - M3 — Business metrics: advanced/step-2-business-metrics.md
  - M4 — Semantic conventions with Weaver: advanced/step-3-weaver-pipeline.md
  - M5 — The collector as control point: module-3.md
  - M6 — Taming high-cardinality metrics: advanced/step-5-high-cardinality.md
  - M7 — Scrubbing PII from logs: advanced/step-6-pii-logs.md
  - M8 — The cost of observability: advanced/step-4-cost-of-observability.md
  - M9 — Sampling strategy: module-4.md
  - M10 — Operating at scale + OpAMP/BindPlane: module-5.md
  - Troubleshooting: troubleshooting.md
  # Optional extra exercises, still inside the one guide — not a separate track.
  - Extra exercises & appendices (optional):
      - Catalog overview: advanced/catalog.md
      - "A1 — Fix a broken trace [25m][med]": advanced/catalog-a1-broken-trace.md
      - "A2 — Log ↔ trace correlation [20m][med]": advanced/catalog-a2-log-trace-correlation.md
      - "A3 — Multi-language instrumentation [25m][med]": advanced/catalog-a3-multi-language.md
      - "A4 — Exceptions / span-events [20m][med]": advanced/catalog-a4-exceptions-span-events.md
      - "A5 — Baggage propagation (player.tier) [25m][med]": advanced/catalog-a5-baggage-propagation.md
      - "B1 — RED metrics from spans [20m][med]": advanced/catalog-b1-spanmetrics.md
      - "B2 — Cost-center tagging [20m][med]": advanced/catalog-b2-cost-center.md
      - "B3 — Drop noise (filter) [15m][easy]": advanced/catalog-b3-filter-drop-noise.md
      - "B4 — OTTL enrichment (bet.tier) [20m][med]": advanced/catalog-b4-ottl-enrichment.md
      - "B5 — Structure logs (OTTL) [25m][med]": advanced/catalog-b5-ottl-log-structuring.md
      - "B6 — Metric temporality (delta) [20m][med]": advanced/catalog-b6-cumulativetodelta.md
      - "B7 — Collector pipeline health [25m][med]": advanced/catalog-b7-collector-health.md
      - "C1 — Dashboard via dtctl [20m][med]": advanced/catalog-c1-dtctl-dashboard.md
      - "C2 — Reliability SLO via dtctl [20m][med]": advanced/catalog-c2-slo.md
      - "C3 — Metric event / Davis alert [20m][med]": advanced/catalog-c3-metric-davis-alert.md
      - "C4 — Dynatrace cost centers [20m][med]": advanced/catalog-c4-dynatrace-cost-center.md
      - "Instrumentation Score — concept": advanced/instrumentation-score-concept.md
      - "D1 — Instrumentation Score (capstone) [40m][hard]": advanced/catalog-d1-instrumentation-score.md
      - 'Appendix — Central config: OpAMP bridge + BindPlane gateway': advanced/bindplane-opamp.md
      - 'Appendix — Local CI/CD: Gitea Actions & Packages': advanced/gitea-local-cicd.md

plugins:
  - search
  # Pinned in requirements-docs.txt (mkdocs-mermaid2-plugin==1.2.3).
  # theme is a raw-JS expression (the leading ^) so each diagram follows the
  # Material palette the attendee has selected: slate -> dark, default -> light.
  - mermaid2:
      version: 10.9.1
      arguments:
        # Raw-JS expression (leading ^) evaluated at page load, so each diagram
        # follows the Material palette the attendee has selected: slate -> dark,
        # default -> light. Material persists the choice in localStorage, so a
        # reload after toggling re-renders the diagrams in the new palette.
        # NB: do NOT add an `extra_javascript:` entry here — mermaid2 1.2.x
        # misreads the first extra_javascript as the mermaid library override
        # and then skips loading the real runtime (diagrams silently fail).
        theme: |
          ^(window.matchMedia && JSON.parse(window.localStorage.getItem("__palette") || "{}")?.color?.scheme === "slate") ? "dark" : "default"
