name: Build casino images (Gitea CI)

# In-cluster CI for the casino app (ISI-7641 / WS-B, parent plan ISI-7624).
#
# This is the Gitea-Actions port of .github/workflows/casino-images.yml. It runs
# on the in-cluster Gitea Actions runner (ISI-7639 / WS-A) and pushes the 7
# deployed casino service images to the Gitea container registry via the WS-D alias
# (ISI-7638):  gitea.local:30001/casino/vegasapp-<svc>:<tag>  — byte-identical to
# the ref node containerd pulls back, and the exact ref the WS-C Gitea render
# (`IMAGE_SOURCE=gitea`, ISI-7640) deploys. Together they close the attendee
# "edit code -> CI builds image -> redeploy" loop with NO dependency on ghcr.io.
#
# Redeploy semantics (ISI-7882 / ISI-7867 gap 3): each merge builds a per-commit
# :<sha> tag and the `redeploy` job writes that tag back into k8s/*.yaml and
# commits it to main. That git change — not a re-pushed pinned tag — is what Argo
# CD syncs, so every merged casino edit actually rolls new pods (running image
# flips to <sha>). The write-back is [skip ci] + k8s/** is not a trigger path, so
# there is no CI -> commit -> CI loop.
#
# This file is seeded INTO the casino/casino Gitea repo by gitops/install/
# seed-gitea.sh, alongside apps/casino/ (the build context) and
# deploy/casino/IMAGE_VERSION (the tag source of truth). The GHCR GitHub Actions
# workflow is kept as the maintainer reference-image path (do NOT delete it).
#
# D1 (opt-in, not bootstrap-blocking): the seed push that first lands this file
# carries a `[skip ci]` commit marker, so bringing the environment up does NOT
# kick off 7 in-cluster builds on the 8 GB codespace. The lab is triggered when
# an attendee edits a service and pushes a normal commit (or runs it manually).
on:
  push:
    branches:
      - main
    paths:
      - "apps/casino/**"
      - ".gitea/workflows/casino-images.yml"
  workflow_dispatch:

env:
  # WS-D registry alias (ISI-7638). dind on the runner trusts it as insecure and
  # resolves it to the kind node NodePort via the pod hostAlias; node containerd
  # resolves the same name, so push and pull are identical strings.
  REGISTRY: gitea.local:30001
  # Gitea packages owner/org — CASINO_ORG in seed-gitea.sh (ISI-6796).
  OWNER: casino
  # The runner's dind build daemon (gitea-act-runner sidecar, tcp:2375 on the
  # shared pod netns). act_runner does not propagate this into the job container,
  # so set it explicitly here (ISI-7639 config: network=host, DOCKER_HOST=2375).
  DOCKER_HOST: tcp://localhost:2375

jobs:
  build:
    name: ${{ matrix.service }}
    # Maps to the runner's "ubuntu-latest:docker://node:20-bookworm" label
    # (ISI-7639). Jobs start from node:20-bookworm so JS actions (checkout) run;
    # the docker client is added below since that base image ships none.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 7 services the training topology actually deploys. `gateway` is
        # intentionally excluded — exactly as .github/workflows/casino-images.yml
        # excludes it (ISI-7625 D3): nothing in deploy/casino/k8s references a
        # vegasapp-gateway image, and the WS-C IMAGE_SOURCE=gitea render only
        # rewrites the deployed vegasapp-* refs, so a gateway image would never be
        # pulled. Building it here would only burn an in-cluster build on the 8 GB
        # ceiling. If gateway ever enters the deployed topology, re-add it here AND
        # add a manifest — don't re-add it on its own.
        service:
          - frontend
          - slots
          - blackjack
          - dashboard
          - roulette
          - dice
          - scoring
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node:20-bookworm has no docker client. Install the Debian docker.io
      # package (client + deps); we only use the client, which talks to the dind
      # sidecar over $DOCKER_HOST. Kept simple and self-contained — no buildx,
      # no QEMU: single-arch (linux/amd64) builds only (D1 / 8 GB ceiling).
      - name: Install docker client
        run: |
          set -eux
          if ! command -v docker >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends docker.io
          fi
          docker version

      # Tag = deploy/casino/IMAGE_VERSION — the SAME single source of truth the
      # WS-C render (deploy/casino/render-images.sh) pins the manifests to, so the
      # tag CI publishes always matches the tag Argo CD deploys. Fall back to
      # :latest only if the file is absent (older seed layout).
      - name: Resolve image tag
        id: tag
        run: |
          set -eu
          TAG=latest
          if [ -r deploy/casino/IMAGE_VERSION ]; then
            TAG="$(tr -d '[:space:]' < deploy/casino/IMAGE_VERSION)"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building vegasapp-${{ matrix.service }} as $REGISTRY/$OWNER/vegasapp-${{ matrix.service }}:$TAG"

      # Gitea injects a per-job token scoped to the triggering actor's rights.
      # The actor (seeded admin 'attendee', owner of the casino org) can write the
      # org's container packages. Login against the same Gitea instance the alias
      # points at. D3: packages are public-read, so PULLs need no secret — only
      # this push path authenticates.
      - name: Log in to the Gitea container registry
        run: |
          echo "${{ secrets.GITEA_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # Build once, tag three ways, push all three (ISI-7882 / redeploy semantics):
      #   :<sha>          the DEPLOYABLE ref — unique per commit, so the k8s
      #                   write-back below changes git content and Argo CD rolls
      #                   the newly built image instead of re-syncing the same
      #                   pinned :<IMAGE_VERSION> string (which is a no-op to Argo).
      #   :latest         moving convenience ref.
      #   :<IMAGE_VERSION> human-readable release tag (optional; the seed render
      #                   pins manifests to it before the first CI run).
      # GITHUB_SHA short form is computed the SAME way the redeploy job recomputes
      # it, so the tag CI pushes and the tag written into k8s/ always match.
      - name: Build and push
        run: |
          set -eux
          IMG="$REGISTRY/$OWNER/vegasapp-${{ matrix.service }}"
          TAG="${{ steps.tag.outputs.value }}"
          SHA="${GITHUB_SHA:0:7}"
          docker build \
            --file "apps/casino/${{ matrix.service }}/Dockerfile" \
            --tag "$IMG:$SHA" \
            --tag "$IMG:$TAG" \
            --tag "$IMG:latest" \
            apps/casino
          docker push "$IMG:$SHA"
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"

  # ---------------------------------------------------------------------------
  # Redeploy write-back (ISI-7882 / ISI-7867 gap 3).
  #
  # Argo CD (gitops/argocd/casino-application.yaml) syncs path `k8s` of
  # casino/casino and redeploys ONLY when the git content changes. Re-pushing the
  # same :<IMAGE_VERSION> tag string is a no-op to Argo — "the same release." So
  # after all 7 images are built and pushed under the per-commit :<sha> tag, this
  # job rewrites the 7 vegasapp-* image refs in k8s/*.yaml to :<sha> and commits
  # it back to main. THAT commit is what Argo syncs -> new pods roll with the
  # newly built image (observable: running tag flips to <sha>, not a repeated
  # 0.xx).
  #
  # Runs only if every matrix build succeeded (needs: build) — we never bump the
  # manifests to a <sha> whose images are not all pushed.
  #
  # No infinite loop: the trigger paths above are apps/casino/** and this
  # workflow file only — k8s/** is NOT a trigger path — AND the write-back commit
  # carries [skip ci] (Gitea's default SKIP_WORKFLOW_STRINGS). Belt and
  # suspenders so neither a path-filter change nor a skip-string change alone can
  # reopen a CI -> commit -> CI loop.
  redeploy:
    name: write-back k8s tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bump the tag on the 7 deployed vegasapp-* image refs to the per-commit
      # <sha>. Plain sed, no kustomize — the same plain-YAML contract the seed
      # render (deploy/casino/render-images.sh) and ISI-6794 manifests keep so an
      # attendee can read k8s/ end to end. The service name is enumerated exactly
      # (the 7 matrix services) and the registry HOST is left untouched, so the
      # rewrite is robust whether the refs are the Gitea alias
      # (gitea.local:30001/casino/vegasapp-*) or the GHCR baseline
      # (ghcr.io/<owner>/otel-training/vegasapp-*). Only the :<tag> suffix moves.
      - name: Bump k8s image tags to the built SHA
        id: bump
        run: |
          set -eu
          SHA="${GITHUB_SHA:0:7}"
          SERVICES='frontend|slots|blackjack|dashboard|roulette|dice|scoring'
          # [A-Za-z0-9._-]+ matches a Docker tag and stops at the closing quote /
          # whitespace, so the host prefix and quoting are preserved.
          sed -E -i \
            "s#(vegasapp-(${SERVICES})):[A-Za-z0-9._-]+#\1:${SHA}#g" \
            k8s/*.yaml
          if git diff --quiet -- k8s; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "k8s/ already pins vegasapp-* to :${SHA} — nothing to write back."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- k8s
          fi

      # Commit + push the tag bump as the triggering actor, back onto main. The
      # auto-provisioned secrets.GITEA_TOKEN (same token the build job logs into
      # the registry with) has write to this repo. Push to the SAME server
      # checkout cloned from (GITHUB_SERVER_URL) so the host is always reachable
      # from inside the runner, whatever the instance URL is.
      - name: Commit and push write-back
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -eu
          SHA="${GITHUB_SHA:0:7}"
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.gitea.local"
          git add k8s
          git commit -q -m "ci: redeploy casino at ${SHA} [skip ci]"
          SERVER_URL="${GITHUB_SERVER_URL}"
          SCHEME="${SERVER_URL%%://*}"
          HOSTPATH="${SERVER_URL#*://}"
          HOSTPATH="${HOSTPATH%/}"
          PUSH_URL="${SCHEME}://${{ github.actor }}:${{ secrets.GITEA_TOKEN }}@${HOSTPATH}/${GITHUB_REPOSITORY}.git"
          git push "$PUSH_URL" "HEAD:${{ github.ref_name }}"
          echo "wrote back k8s/ tag bump to ${SHA} on ${{ github.ref_name }} -> Argo CD will roll the new image."
